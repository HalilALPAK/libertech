<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diş Kliniği 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: sakin, mimari bürosu; araç ön planda, süs yok
   IDEA: mimarın çizim masası: klinik planı ve ekipman kataloğu
   PICTURE: 3D klinik sahnesi ekranın çoğunu kaplar
   COLOUR and TYPE: beyaz/taş zemin, mürekkep gri, tek turuncu vurgu; Figtree
   LAYOUT: üst bar, solda katalog, sağda sahne; telefonda sahne üstte katalog altta */
:root{color-scheme:light dark;
 --bg:light-dark(#f3f2ee,#121417);--panel:light-dark(#ffffff,#1b1e23);--ink:light-dark(#17191d,#eceef1);
 --mute:light-dark(#5d636b,#a3a9b2);--line:light-dark(#dedcd5,#2c3037);--acc:#e0561b;--acc-ink:#fff;
 --chip:light-dark(#f0eee8,#24282e);--scene:light-dark(#e6e4de,#1c1f24)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Figtree,system-ui,sans-serif;overflow-x:clip;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:18px;margin:0;font-weight:700;margin-right:auto;line-height:1.1}
h1 small{display:block;font-weight:400;font-size:13px;color:var(--mute);margin-top:3px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:0 14px;height:38px;border-radius:8px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px #0002}
.act{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);height:40px;padding:0 12px;border-radius:9px;font-weight:600}
.btn:hover{border-color:var(--mute)}
.btn[disabled]{opacity:.45;cursor:default}
.app{flex:1;display:grid;grid-template-columns:260px minmax(0,1fr);min-height:0}
aside{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 12px 20px}
aside h2{font-size:13px;color:var(--mute);font-weight:600;margin:14px 4px 6px}
aside h2:first-child{margin-top:0}
.cat{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cat button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 9px;text-align:left;min-height:48px;line-height:1.2}
.cat button:hover{border-color:var(--acc)}
.cat b{display:block;font-size:13.5px;font-weight:600}
.cat span{font-size:12px;color:var(--mute)}
aside.off .cat button{opacity:.4;pointer-events:none}
.rooms{margin:16px 4px 0;font-size:13.5px}
.rooms div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)}
.rooms div span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.rooms .tot{font-weight:700;border-bottom:0}
.note{font-size:12.5px;color:var(--mute);margin:10px 4px 0}
#stage{position:relative;overflow:hidden;background:var(--scene);min-height:340px}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hint{position:absolute;left:12px;top:12px;right:12px;pointer-events:none;display:flex;transition:opacity .6s}
.hint p{margin:0;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);padding:7px 11px;border-radius:9px;font-size:13.5px;max-width:560px}
.sel{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;width:min(300px,calc(100% - 24px));box-shadow:0 6px 24px #0003}
.sel[hidden],.pad[hidden]{display:none}
.sel h3{margin:0;font-size:16px}
.sel .dim{color:var(--mute);font-size:13px;margin:2px 0 10px}
.sel .row{display:flex;gap:6px;margin-bottom:10px}
.sel .row .btn{flex:1}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.sw button[aria-pressed=true]{box-shadow:0 0 0 2px var(--acc)}
.del{color:#c0392b}
.unitname{font-size:15px!important;color:var(--ink)!important;font-weight:700!important;margin:0 4px 10px!important}
.row.wrap{flex-wrap:wrap;margin-bottom:0}.row.wrap .btn{flex:1 1 auto}
[hidden]{display:none!important}
.pad{position:absolute;right:14px;bottom:14px;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px}
.pad button{border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 90%,transparent);border-radius:12px;font-size:20px;touch-action:none;user-select:none}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.err{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--mute)}
@media(max-width:760px){
 .app{grid-template-columns:1fr;grid-template-rows:64vh auto}
 #stage{order:1}aside{order:2;border-right:0;border-top:1px solid var(--line)}
 .cat{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
 h1 small{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
 <h1>Diş Kliniği 3D<small>Projeden aktarılan zemin kat planı · eşyaları, kapıları ve duvarları düzenle</small></h1>
 <div class="seg" role="group" aria-label="Görünüm">
  <button id="v-plan" aria-pressed="false">Plan</button>
  <button id="v-orbit" aria-pressed="true">3D</button>
  <button id="v-walk" aria-pressed="false">İçinde gez</button>
 </div>
 <div class="act">
  <button class="btn" id="b-undo" disabled>Geri al</button>
  <button class="btn" id="b-cut">Duvarlar: alçak</button>
  <button class="btn" id="b-reset">Planı sıfırla</button>
  <button class="btn" id="b-export" hidden>Planı indir</button>
 </div>
</header>
<div class="app">
 <aside id="side">
  <h2 class="unitname" id="unitname"></h2>
  <div id="catalog"></div>
  <div class="rooms" id="rooms"></div>
  <p class="note">Ölçüler plan fotoğrafından okunmuştur, birkaç santim sapma olabilir. Değişiklikler bu tarayıcıda saklanır.</p>
 </aside>
 <main id="stage">
  <div class="hint"><p id="hint"></p></div>
  <div class="sel" id="sel" hidden>
   <h3 id="s-name"></h3>
   <div class="dim" id="s-dim"></div>
   <div class="row"><button class="btn" id="s-rot">Döndür 45°</button><button class="btn del" id="s-del">Sil</button></div>
   <div class="sw" id="s-sw" aria-label="Renk"></div>
  </div>
  <div class="sel" id="wsel" hidden>
   <h3 id="w-name"></h3>
   <div class="dim" id="w-dim"></div>
   <div class="row wrap" id="w-row"></div>
  </div>
  <div class="pad" id="pad" hidden>
   <button class="u" data-k="f" aria-label="İleri">▲</button>
   <button class="l" data-k="tl" aria-label="Sola dön">⟲</button>
   <button class="d" data-k="b" aria-label="Geri">▼</button>
   <button class="r" data-k="tr" aria-label="Sağa dön">⟳</button>
  </div>
 </main>
</div>

function pickAny(e){setNdc(e);const h=raycaster.intersectObjects([...itemsGroup.children,...wallGroup.children,...(opGroup.visible?opGroup.children:[])],true)[0];if(!h)return null;let o=h.object;
 for(let q=o;q;q=q.parent)if(q.userData&&q.userData.iid)return{iid:q.userData.iid};if(o.userData.op)return{op:o.userData.op,wall:o.userData.wall};if(o.userData.wall)return{wall:o.userData.wall};return null;}
function pick(e){setNdc(e);const h=raycaster.intersectObjects(itemsGroup.children,true)[0];if(!h)return null;let o=h.object;while(o&&!o.userData.iid)o=o.parent;return o?o.userData.iid:null;}
function floorPt(e){setNdc(e);return raycaster.ray.intersectPlane(floorPlane,tmp)?tmp.clone():null;}
const snap=v=>Math.round(v*20)/20,clampX=v=>Math.min(U.W-.15,Math.max(.15,v)),clampZ=v=>Math.min(U.D-.15,Math.max(.15,v));

// düzenleme olayları: kontrollerden ÖNCE bağlanır ki eşya sürüklerken kamera kımıldamasın
let drag=null,down=null,look=null,selW=null,selO=null,opDrag=null;
const wBox=new THREE.Box3Helper(new THREE.Box3(),0xe0561b);wBox.material.depthTest=false;wBox.renderOrder=21;wBox.visible=false;scene.add(wBox);
function overlap(w,s,e,ex){return w.o.some(q=>q!==ex&&s<q.e+.05&&e>q.s-.05);}
function freeSpot(w,wd,c){const L=wLen(w);let best=null;for(let s=.1;s<=L-wd-.1+1e-6;s+=.05){if(!overlap(w,s,s+wd)&&(best==null||Math.abs(s+wd/2-c)<Math.abs(best+wd/2-c)))best=s;}return best==null?null:Math.round(best*100)/100;}
function wallBox(w,s,e,y1){const[ax,az]=w.a,L=wLen(w),ux=(w.b[0]-ax)/L,uz=(w.b[1]-az)/L,x0=ax+ux*s,z0=az+uz*s,x1=ax+ux*e,z1=az+uz*e,h=w.t/2+.04;
 wBox.box.min.set(Math.min(x0,x1)-Math.abs(uz)*h,0,Math.min(z0,z1)-Math.abs(ux)*h);wBox.box.max.set(Math.max(x0,x1)+Math.abs(uz)*h,y1,Math.max(z0,z1)+Math.abs(ux)*h);wBox.visible=true;}
function clearWallSel(){selW=selO=null;renderWsel();}
function renderWsel(){const p=$('#wsel');if(!(selW||selO)||!editing()){p.hidden=true;wBox.visible=false;return;}p.hidden=false;const w=selO?selO.w:selW,L=wLen(w);
 if(selO){const o=selO.o,isD=o.b===0;$('#w-name').textContent=isD?(o.entry?'Giriş kapısı':'Kapı'):'Pencere';$('#w-dim').textContent=`${Math.round((o.e-o.s)*100)} cm · sürükleyerek duvar boyunca taşı, köşede yan duvara geçer`;
  $('#w-row').innerHTML='<button class="btn" data-a="nar">Daralt</button><button class="btn" data-a="wid">Genişlet</button><button class="btn del" data-a="delop">Sil</button>';wallBox(w,o.s,o.e,Math.min(o.t+.1,wallCut));}
 else{$('#w-name').textContent=w.glass?'Cam duvar':'Duvar';$('#w-dim').textContent=`${fmt(L)} · ${Math.round(w.t*100)} cm kalınlık`;
  $('#w-row').innerHTML=`<button class="btn" data-a="glass">${w.glass?'Normal duvar yap':'Cam duvar yap'}</button><button class="btn" data-a="door">Kapı ekle</button><button class="btn" data-a="win">Pencere ekle</button>`;wallBox(w,-w.t/2,L+w.t/2,wallCut);}}
$('#w-row').addEventListener('click',e=>{const a=e.target.dataset&&e.target.dataset.a;if(!a||!(selW||selO))return;const w=selO?selO.w:selW,L=wLen(w),before=snapState();
 if(a==='glass')w.glass=!w.glass;
 else if(a==='door'||a==='win'){const wd=a==='door'?.9:1.2,pos=freeSpot(w,wd,L/2);if(pos==null){showHint('Bu duvarda yeterli boş yer yok.');return;}const o=a==='door'?{s:pos,e:pos+wd,b:0,t:2.1}:{s:pos,e:pos+wd,b:.9,t:2.2};w.o.push(o);selO={o,w};selW=null;}
 else if(a==='delop'){w.o.splice(w.o.indexOf(selO.o),1);selW=w;selO=null;}
 else{const o=selO.o,nw=Math.round((o.e-o.s+(a==='wid'?.1:-.1))*100)/100;if(nw<.5||o.s+nw>L-.05||overlap(w,o.s,o.s+nw,o))return;o.e=o.s+nw;}
 pushUndo(before);rebuildWalls();saveWalls();renderWsel();});
const cvs=renderer.domElement;
cvs.addEventListener('pointerdown',e=>{
 if(view==='walk'){look={x:e.clientX,y:e.clientY};cvs.setPointerCapture(e.pointerId);return;}
 const h=pickAny(e);
 if(h&&h.iid){const id=h.iid,it=items.find(i=>i.id===id);select(id);const p=floorPt(e);if(!p)return;drag={it,ox:p.x-it.x,oz:p.z-it.z,snap:snapState(),moved:false};ctl().enabled=false;cvs.setPointerCapture(e.pointerId);}
 else if(h&&h.op){select(null);selO={o:h.op,w:h.wall};selW=null;renderWsel();opDrag={o:h.op,w:h.wall,snap:snapState(),moved:false};ctl().enabled=false;cvs.setPointerCapture(e.pointerId);}
 else if(h&&h.wall){select(null);selW=h.wall;selO=null;renderWsel();down={x:e.clientX,y:e.clientY,keep:1};}
 else down={x:e.clientX,y:e.clientY};});
cvs.addEventListener('pointermove',e=>{
 if(look){walk.yaw-=(e.clientX-look.x)*.005;walk.pitch=Math.max(-1.2,Math.min(1.2,walk.pitch-(e.clientY-look.y)*.005));look={x:e.clientX,y:e.clientY};return;}
 if(opDrag){const p=floorPt(e);if(!p)return;const o=opDrag.o,wd=o.e-o.s;let best=null;
  for(const w of U.walls){const[ax,az]=w.a,[bx,bz]=w.b,L=Math.hypot(bx-ax,bz-az);if(L<wd+.2)continue;const ux=(bx-ax)/L,uz=(bz-az)/L,t=(p.x-ax)*ux+(p.z-az)*uz,tc=Math.max(0,Math.min(L,t)),d=Math.hypot(ax+ux*tc-p.x,az+uz*tc-p.z);if(!best||d<best.d)best={w,d,t,L};}
  if(!best)return;const s0=Math.max(.1,Math.min(best.L-wd-.1,snap(best.t-wd/2)));if(overlap(best.w,s0,s0+wd,o))return;
  if(best.w!==opDrag.w){opDrag.w.o.splice(opDrag.w.o.indexOf(o),1);best.w.o.push(o);opDrag.w=best.w;selO.w=best.w;}
  if(Math.abs(o.s-s0)>.001||!opDrag.moved){o.s=s0;o.e=Math.round((s0+wd)*100)/100;rebuildWalls();renderWsel();}opDrag.moved=true;cvs.style.cursor='grabbing';return;}
 if(!drag)return;const p=floorPt(e);if(!p)return;const it=drag.it;it.x=clampX(snap(p.x-drag.ox));it.z=clampZ(snap(p.z-drag.oz));objs.get(it.id).position.set(it.x,0,it.z);helper.setFromObject(objs.get(it.id));drag.moved=true;
 cvs.style.cursor='grabbing';});
const up=e=>{look=null;cvs.style.cursor='';
 if(opDrag){if(opDrag.moved){pushUndo(opDrag.snap);saveWalls();}opDrag=null;ctl().enabled=true;}
 else if(drag){if(drag.moved){pushUndo(drag.snap);save();}drag=null;ctl().enabled=true;}
 else if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<5){if(!down.keep){select(null);clearWallSel();}}down=null;};
cvs.addEventListener('pointerup',up);cvs.addEventListener('pointercancel',up);

const planCtl=new THREE.OrbitControls(ortho,cvs);planCtl.target.set(5.5,0,4.5);planCtl.enableRotate=false;planCtl.screenSpacePanning=true;
planCtl.mouseButtons={LEFT:THREE.MOUSE.PAN,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.PAN};planCtl.touches={ONE:THREE.TOUCH.PAN,TWO:THREE.TOUCH.DOLLY_PAN};planCtl.minZoom=.5;planCtl.maxZoom=5;planCtl.update();
const orbitCtl=new THREE.OrbitControls(persp,cvs);orbitCtl.target.set(5.5,0,4.5);orbitCtl.enableDamping=true;orbitCtl.maxPolarAngle=1.48;orbitCtl.minDistance=3;orbitCtl.maxDistance=35;orbitCtl.update();
const ctl=()=>view==='plan'?planCtl:orbitCtl;

const HINT={plan:'Eşyayı sürükleyerek taşı. Kapı ve pencereleri (turuncu/mavi işaretler) duvar boyunca sürükle. Duvara tıkla: cam duvar yap, kapı veya pencere ekle.',
 orbit:'Boş alanı sürükleyerek etrafında dön, sağ tıkla kaydır. Eşyaları ve kapı işaretlerini sürükleyebilir, duvara tıklayıp cam duvar yapabilirsin.',
 walk:'W A S D ile yürü, ← → ile dön, ekranı sürükleyerek etrafına bak. Telefonda alttaki tuşları kullan.'};
let furnBoxes=[],hintT;
function showHint(t){const h=$('.hint');$('#hint').textContent=t;h.style.opacity=1;clearTimeout(hintT);hintT=setTimeout(()=>h.style.opacity=0,7000);}
let fitted=false;
const editing=()=>view==='plan'||view==='orbit';
const kFit=()=>Math.max(1,.9/(persp.aspect||1));
function fitOrbit(){const k=kFit()*Math.max(U.W/11,U.D/13);orbitCtl.target.set(U.W/2,0,U.D/2);persp.position.set(U.W/2,12.5*k,U.D/2+11.5*k);orbitCtl.update();}
function setShadow(){const site=false,sc=sun.shadow.camera,e=Math.max(U.W,U.D)/2+3,c=new THREE.Vector3(U.W/2,0,U.D/2);
 Object.assign(sc,{left:-e,right:e,top:e,bottom:-e,far:site?300:40});sc.updateProjectionMatrix();sun.target.position.copy(c);sun.position.copy(SUN).multiplyScalar(site?120:16).add(c);sun.shadow.bias=site?-.0012:-.0006;}
function setView(v){view=v;
 for(const k of['plan','orbit','walk'])$('#v-'+k).setAttribute('aria-pressed',k===v);
 planCtl.enabled=v==='plan';orbitCtl.enabled=v==='orbit';
 setShadow();
 orbitCtl.minDistance=3;orbitCtl.maxDistance=45;orbitCtl.maxPolarAngle=1.48;
 buildWalls(v==='orbit'&&cutWalls?1.05:H);
 roomLabels.visible=v==='plan';ceiling.visible=v==='walk';opGroup.visible=v==='plan'||v==='orbit';$('#pad').hidden=v!=='walk';$('#side').classList.toggle('off',v==='walk');
  $('#b-cut').hidden=v!=='orbit';showHint(HINT[v]);
 if(v==='walk'){furnBoxes=items.filter(i=>i.type!=='rug').map(i=>{const b=new THREE.Box3().setFromObject(objs.get(i.id));return{x0:b.min.x,x1:b.max.x,z0:b.min.z,z1:b.max.z};});if(hits(walk.x,walk.z))Object.assign(walk,U.start);}
 select(selected);renderWsel();resize();}
$('#v-plan').onclick=()=>setView('plan');$('#v-orbit').onclick=()=>setView('orbit');$('#v-walk').onclick=()=>setView('walk');
$('#b-cut').onclick=()=>{cutWalls=!cutWalls;$('#b-cut').textContent='Duvarlar: '+(cutWalls?'alçak':'tam');buildWalls(cutWalls?1.05:H);renderWsel();};

function hits(x,z){const r=.25;if(x<r||x>U.W-r||z<r||z>U.D-r)return true;for(const b of blockers.concat(furnBoxes))if(x>b.x0-r&&x<b.x1+r&&z>b.z0-r&&z<b.z1+r)return true;return false;}
const keys={},pad={};
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;keys[e.code]=true;
 if(view==='walk'&&/^(Arrow|Space)/.test(e.code))e.preventDefault();
 if((e.ctrlKey||e.metaKey)&&e.code==='KeyZ'){e.preventDefault();$('#b-undo').click();}
 else if(editing()&&selected&&e.code==='KeyR')rotate();
 else if(editing()&&selected&&(e.code==='Delete'||e.code==='Backspace'))remove();
 else if(editing()&&selO&&(e.code==='Delete'||e.code==='Backspace')){const b=document.querySelector('#w-row [data-a=delop]');b&&b.click();}
 else if(e.code==='Escape'){select(null);clearWallSel();}});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
for(const b of document.querySelectorAll('#pad button')){const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();pad[k]=1;b.setPointerCapture(e.pointerId);});for(const ev of['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>pad[k]=0);}
function stepWalk(dt){
 const f=(keys.KeyW||keys.ArrowUp||pad.f)?1:0,bk=(keys.KeyS||keys.ArrowDown||pad.b)?1:0,l=keys.KeyA?1:0,r=keys.KeyD?1:0,tl=(keys.ArrowLeft||pad.tl)?1:0,tr=(keys.ArrowRight||pad.tr)?1:0;
 walk.yaw+=(tl-tr)*1.7*dt;const sp=1.7*dt,fx=-Math.sin(walk.yaw),fz=-Math.cos(walk.yaw),rx=Math.cos(walk.yaw),rz=-Math.sin(walk.yaw);
 const dx=((f-bk)*fx+(r-l)*rx)*sp,dz=((f-bk)*fz+(r-l)*rz)*sp;
 if(dx&&!hits(walk.x+dx,walk.z))walk.x+=dx;if(dz&&!hits(walk.x,walk.z+dz))walk.z+=dz;
 walkCam.position.set(walk.x,1.6,walk.z);walkCam.rotation.set(walk.pitch,walk.yaw,0,'YXZ');}

/* ---------- KATALOG / ODA LİSTESİ ---------- */
const groups={};for(const[k,c]of Object.entries(CAT))(groups[c.g]=groups[c.g]||[]).push(k);
function renderCatalog(){const gs=Object.entries(groups).sort((a,b)=>(b[0]===U.first)-(a[0]===U.first));$('#catalog').innerHTML=gs.map(([g,ks])=>`<h2>${g}</h2><div class="cat">${ks.map(k=>`<button data-t="${k}"><b>${CAT[k].n}</b><span>${Math.round(CAT[k].w*100)}×${Math.round(CAT[k].d*100)} cm</span></button>`).join('')}</div>`).join('');}
$('#catalog').addEventListener('click',e=>{const b=e.target.closest('button[data-t]');if(!b||!editing())return;const t=b.dataset.t;const c=ctl().target;pushUndo();
 const it={id:nid++,type:t,x:clampX(snap(c.x)),z:clampZ(snap(c.z)),rot:0,color:CAT[t].c};items.push(it);makeObj(it);select(it.id);save();});
function renderRooms(){$('#rooms').innerHTML='<h2 style="margin:0 0 6px;font-size:13px;color:var(--mute)">Odalar</h2>'+U.rooms.map(r=>`<div><span>${r.n}</span><span>${area(r).toLocaleString('tr-TR')} m²</span></div>`).join('')+`<div class="tot"><span>Toplam (brüt)</span><span>${U.rooms.reduce((s,r)=>s+area(r),0).toLocaleString('tr-TR')} m²</span></div>`;}
let outlineSlab=null;
function shell(){slab.scale.set(U.W+.6,1,U.D+.6);slab.position.set(U.W/2,-.05,U.D/2);slab.visible=!U.outline;if(outlineSlab){aptRoot.remove(outlineSlab);outlineSlab=null;}
 if(U.outline){const sh=new THREE.Shape(U.outline.map(([x,z])=>new THREE.Vector2(x,-z)));outlineSlab=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:.12,bevelEnabled:false}),M('#8d8a83'));outlineSlab.rotation.x=-Math.PI/2;outlineSlab.position.y=-.12;outlineSlab.receiveShadow=true;aptRoot.add(outlineSlab);}
 ceiling.scale.set(U.W,U.D,1);ceiling.position.set(U.W/2,H,U.D/2);
 ortho.position.set(U.W/2,40,U.D/2+.02);planCtl.target.set(U.W/2,0,U.D/2);planCtl.update();$('#unitname').textContent=U.name;}
function loadUnit(key){const n=UNITS[key];const same=n===U;U=n;if(!same){selected=null;undo.length=0;$('#b-undo').disabled=true;loadItems();loadWalls();clearWallSel();rebuildAll();Object.assign(walk,U.start,{pitch:-.05});}
 buildFloors();shell();renderCatalog();renderRooms();resize();}
renderCatalog();renderRooms();shell();

/* ---------- ÇİZİM DÖNGÜSÜ ---------- */
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);const a=w/h;
 persp.aspect=walkCam.aspect=a;persp.updateProjectionMatrix();walkCam.updateProjectionMatrix();
 let vh=U.D+1.6,vw=vh*a;if(vw<U.W+1.6){vw=U.W+1.6;vh=vw/a;}Object.assign(ortho,{left:-vw/2,right:vw/2,top:vh/2,bottom:-vh/2});ortho.updateProjectionMatrix();if(!fitted){fitted=true;fitOrbit();}}
const ro=new ResizeObserver(resize);ro.observe(stage);
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(view==='walk')stepWalk(dt);else ctl().update();
 if(helper.visible&&selected&&objs.get(selected))helper.setFromObject(objs.get(selected));renderer.render(scene,cam());requestAnimationFrame(loop);}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>buildFloors());
rebuildAll();setView('orbit');requestAnimationFrame(loop);
}
</script>
</body>
</html>
